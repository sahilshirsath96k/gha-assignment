name: matrix_build

on:
  push:
  workflow_dispatch:

jobs:

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04

        node:
          - 18
          - 20

        exclude:
          - os: ubuntu-22.04
            node: 18

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Print Node and npm versions
        run: |
          node -v
          npm -v

      - name: Create report
        run: |
          mkdir -p out

          echo "OS: $RUNNER_OS" > out/report-${{ matrix.os }}-${{ matrix.node }}.txt
          echo "Node version: $(node --version)" >> out/report-${{ matrix.os }}-${{ matrix.node }}.txt
          echo "npm version: $(npm --version)" >> out/report-${{ matrix.os }}-${{ matrix.node }}.txt
          echo "Run number: $GITHUB_RUN_NUMBER" >> out/report-${{ matrix.os }}-${{ matrix.node }}.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.node }}
          path: out/report-${{ matrix.os }}-${{ matrix.node }}.txt


  collect:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Print all reports
        run: |
          echo "Downloaded artifacts:"
          find all-reports -type f -print

          echo ""
          echo "Contents of every report:"

          for file in $(find all-reports -type f); do
            echo "========================================"
            echo "FILE: $file"
            echo "========================================"
            cat "$file"
            echo ""
          done
