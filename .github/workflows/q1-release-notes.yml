name: Q1 Release Notes
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        type: string
        required: true
        default: "1.0.0"
      release_type:
        description: "Type of release"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.tag.outputs.build_tag }}
      build_date: ${{ steps.date.outputs.build_date }}
    steps:
      - id: tag
        name: Compute build tag
        run: |
          TAG="v${{ inputs.version }}-${{ inputs.release_type }}-${{ github.run_number }}"
          echo "build_tag=$TAG" >> "$GITHUB_OUTPUT"
      - id: date
        name: Compute build date
        run: echo "build_date=$(date +%F)" >> "$GITHUB_OUTPUT"
  announce:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Print outputs
        run: |
          echo "Build tag: ${{ needs.prepare.outputs.build_tag }}"
          echo "Build date: ${{ needs.prepare.outputs.build_date }}"
      - name: Write summary
        run: |
          {
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | ${{ inputs.version }} |"
            echo "| Release type | ${{ inputs.release_type }} |"
            echo "| Build tag | ${{ needs.prepare.outputs.build_tag }} |"
            echo "| Build date | ${{ needs.prepare.outputs.build_date }} |"
          } >> "$GITHUB_STEP_SUMMARY"
